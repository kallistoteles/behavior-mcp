[build-system]
requires = ["hatchling==1.32.4", "editables==0.6"]
build-backend = "hatchling.build"

[project]
name = "behavior-mcp"
version = "0.1.0"
description = "Agent-facing integration with the released public Behavior API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
  "behavior @ https://github.com/kallistoteles/behavior-ir/releases/download/v0.14.0/behavior-0.14.0-cp313-abi3-manylinux_2_28_x86_64.whl#sha256=794d2dd5ddf8613c52f524a1b4b74c0246d86a5ea52414424ab89ef104e86513",
  "mcp==2.3.0",
  "mcp-types==2.3.0",
  "jsonschema==4.26.0",
]

[dependency-groups]
dev = ["editables==0.6", "hatchling==1.32.4", "pytest==9.1.1", "pytest-asyncio==1.4.1", "mypy==2.4.0", "types-jsonschema==4.26.0.20261006"]

[project.scripts]
behavior-mcp = "behavior_mcp.server:main"
behavior-mcp-admin = "behavior_mcp.admin:main"

[tool.hatch.build.targets.wheel]
packages = ["src/behavior_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"specs/001-agent-native-systems/contracts" = "behavior_mcp/contracts"
"SEMANTIC_GAPS.md" = "behavior_mcp/SEMANTIC_GAPS.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/behavior_mcp"]

[[tool.mypy.overrides]]
module = ["behavior.*"]
follow_untyped_imports = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
no-build-isolation-package = ["behavior-mcp"]

[tool.hatch.build.targets.sdist]
include = [".gitignore", "src", "tests", "scripts", "docs", "README.md", "LICENSE", "pyproject.toml", "uv.lock", "flake.nix", "flake.lock", "SEMANTIC_GAPS.md", "specs/001-agent-native-systems/contracts", "specs/001-agent-native-systems/evidence/public_api_probe.py", "specs/001-agent-native-systems/evidence/public_api_results.json", ".specify/memory/constitution.md"]
